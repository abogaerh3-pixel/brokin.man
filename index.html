<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BROKIN Chat</title>
  <meta name="theme-color" content="#0b141a" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }

    :root {
      --bg-dark: #0b141a;
      --bg-panel: #111b21;
      --bg-card: #1f2c34;
      --primary: #00a884;
      --primary-hover: #029072;
      --msg-me: #005c4b;
      --msg-other: #202c33;
      --text-main: #e9edef;
      --text-muted: #8696a0;
      --border-color: #2a3942;
    }

    html, body {
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    .screen {
      width: 100%;
      height: 100dvh;
      max-width: 650px;
      margin: 0 auto;
      background: var(--bg-panel);
      position: relative;
    }

    /* شاشة تسجيل الدخول */
    .center-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg-dark);
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .brand-badge {
      display: inline-block;
      background: rgba(0, 168, 132, 0.15);
      color: var(--primary);
      font-weight: 800;
      letter-spacing: 2px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .auth-card h2 {
      margin-bottom: 6px;
      font-size: 22px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .auth-card input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
    }

    .auth-card input:focus {
      border-color: var(--primary);
    }

    .primary-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .primary-btn:hover {
      background: var(--primary-hover);
    }

    .error-text {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }

    /* واجهة ما قبل المحادثة (Lobby) */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .dot-online {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn.active-notif {
      border-color: var(--primary);
      background: rgba(0, 168, 132, 0.18);
    }

    .lobby-body {
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .welcome-box {
      background: linear-gradient(135deg, #18252d, #111b21);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
    }

    .welcome-label {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .welcome-box h3 {
      font-size: 16px;
      color: var(--primary);
      word-break: break-all;
    }

    .chat-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s;
    }

    .chat-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .chat-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(0, 168, 132, 0.16);
      border: 1px solid rgba(0, 168, 132, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-info-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .chat-info-top h4 {
      font-size: 16px;
    }

    .msg-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .chat-info-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .last-preview {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-badge {
      background: var(--primary);
      color: #0b141a;
      font-weight: 800;
      font-size: 12px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .enter-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .notif-banner {
      background: rgba(0, 168, 132, 0.12);
      border: 1px solid rgba(0, 168, 132, 0.35);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }
