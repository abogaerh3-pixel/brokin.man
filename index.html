<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>BROKIN Chat</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    #login-screen {
      margin: auto;
      width: 100%;
      max-width: 360px;
      padding: 24px;
      background: #1e293b;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #login-screen h2 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 20px;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 15px;
      outline: none;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      font-weight: 600;
      background: #10b981;
      color: #06281e;
    }
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-weight: 700;
      font-size: 17px;
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .delete-btn {
      padding: 7px 11px;
      font-size: 13px;
      background: #334155;
      color: #fca5a5;
      border-radius: 8px;
    }
    .delete-btn:hover {
      background: #7f1d1d;
      color: #ffffff;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .msg p { margin: 0; }
    .msg.me {
      align-self: flex-start;
      background: #065f46;
      color: #ecfdf5;
      border-bottom-right-radius: 3px;
    }
    .msg.other {
      align-self: flex-end;
      background: #1e293b;
      color: #f8fafc;
      border-bottom-left-radius: 3px;
    }
    .msg img, .msg video {
      max-width: 100%;
      border-radius: 8px;
      display: block;
    }
    .msg audio {
      max-width: 230px;
    }
    #micBtn.recording {
      background: #dc2626 !important;
      color: #ffffff !important;
    }
    footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #1e293b;
      border-top: 1px solid #334155;
      position: relative;
      z-index: 20;
    }
    .btn.sub-btn {
      padding: 10px 12px;
      background: #334155;
      color: #f8fafc;
    }

    /* نافذة خيارات حذف المحادثة */
    #delete-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.75);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #delete-modal.active {
      display: flex;
    }
    .modal-box {
      width: 100%;
      max-width: 340px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-box h3 {
      margin: 0 0 4px;
      font-size: 17px;
      text-align: center;
    }
    .modal-box p {
      margin: 0 0 6px;
      font-size: 13px;
      color: #cbd5e1;
      text-align: center;
    }
    .opt-self {
      background: #334155;
      color: #f8fafc;
    }
    .opt-both {
      background: #dc2626;
      color: #ffffff;
    }
    .opt-cancel {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    /* نقل شارة Netlify إلى أعلى اليسار بعيداً عن الكتابة */
    a[href*="netlify.com"],
    div[class*="netlify"],
    div[id*="netlify"] {
      position: fixed !important;
      top: 8px !important;
      left: 8px !important;
      bottom: auto !important;
      right: auto !important;
      transform: scale(0.72) !important;
      transform-origin: top left !important;
      opacity: 0.4 !important;
      z-index: 5 !important;
    }
  </style>
</head>
<body>
  <div id="login-screen">
    <h2>دخول خاص</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <p id="error" style="color: #ff6b6b; font-size: 14px; margin: 0;"></p>
  </div>

  <div id="chat-screen">
    <header>
      <span>محادثة خاصة 🔒</span>
      <div class="header-actions">
        <button class="delete-btn" title="حذف المحادثة" onclick="openDeleteModal()">🗑️ حذف</button>
      </div>
    </header>
    <div id="messages"></div>
    <footer>
      <input type="file" id="mediaInput" accept="image/*,video/*" hidden onchange="sendMedia(event)">
      <button class="btn sub-btn" title="صورة أو فيديو" onclick="document.getElementById('mediaInput').click()">📎</button>
      <button class="btn sub-btn" id="micBtn" title="بصمة صوت" onclick="toggleRecord()">🎤</button>
      <input type="text" id="msgInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendText()">
      <button class="btn" onclick="sendText()">➤</button>
    </footer>
  </div>

  <!-- نافذة تأكيد واختيار حذف المحادثة -->
  <div id="delete-modal" onclick="if(event.target===this) closeDeleteModal()">
    <div class="modal-box">
      <h3>حذف المحادثة</h3>
      <p>اختر نوع الحذف المطلوب:</p>
      <button class="opt-self" onclick="confirmDeleteChat('self')">حذف من عندي فقط</button>
      <button class="opt-both" onclick="confirmDeleteChat('both')">حذف للطرفين</button>
      <button class="opt-cancel" onclick="closeDeleteModal()">إلغاء</button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
  <script>
    function openDeleteModal() {
      document.getElementById('delete-modal').classList.add('active');
    }
    function closeDeleteModal() {
      document.getElementById('delete-modal').classList.remove('active');
    }
    function confirmDeleteChat(mode) {
      const label = mode === 'both' ? 'للطرفين' : 'من عندك فقط';
      if (!confirm(`هل أنت متأكد من حذف المحادثة ${label}؟`)) return;
      closeDeleteModal();
      if (typeof window.handleDeleteChat === 'function') {
        window.handleDeleteChat(mode);
      } else {
        document.getElementById('messages').innerHTML = '';
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.error('Service Worker error:', err);
        });
      });
    }
  </script>
</body>
</html>
