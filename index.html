<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BROKIN Chat</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0b0f17" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0f17;
      color: #f3f4f6;
      height: 100dvh;
      overflow: hidden;
    }
    .screen {
      width: 100%;
      height: 100dvh;
      display: none;
      flex-direction: column;
    }
    #authScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0b0f17;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: #141b29;
      border: 1px solid #263248;
      border-radius: 14px;
      padding: 24px;
    }
    .auth-card h1 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }
    .auth-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #2b3850;
      background: #0d131f;
      color: #fff;
      font-size: 14px;
    }
    .auth-card button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #authError {
      color: #f87171;
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
      text-align: center;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #141b29;
      border-bottom: 1px solid #232e42;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
    }
    #unreadBadge {
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }
    #logoutBtn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      cursor: pointer;
      font-size: 13px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-row {
      display: flex;
      width: 100%;
    }
    .msg-row.mine { justify-content: flex-start; }
    .msg-row.other { justify-content: flex-end; }
    .msg-bubble {
      max-width: 78%;
      padding: 10px 12px;
      border-radius: 12px;
      background: #1a2436;
      border: 1px solid #28364f;
      word-break: break-word;
    }
    .msg-row.mine .msg-bubble {
      background: #1d4ed8;
      border-color: #2563eb;
    }
    .msg-image {
      max-width: 240px;
      max-height: 280px;
      border-radius: 8px;
      display: block;
      cursor: pointer;
    }
    .msg-video {
      max-width: 260px;
      max-height: 280px;
      border-radius: 8px;
      display: block;
    }
    .msg-audio {
      max-width: 240px;
      display: block;
    }
    .msg-text {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .msg-meta {
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.7;
      text-align: left;
    }
    .composer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #141b29;
      border-top: 1px solid #232e42;
    }
    #messageInput {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2b3850;
      background: #0d131f;
      color: #fff;
      font-size: 14px;
    }
    .icon-btn {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2b3850;
      background: #1e293b;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .icon-btn.recording {
      background: #dc2626;
      border-color: #ef4444;
    }
    #sendBtn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #mediaLightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #mediaLightbox.open { display: flex; }
    #lightboxStage {
      max-width: 100%;
      max-height: 80dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    #lightboxStage img {
      max-width: 100%;
      max-height: 80dvh;
      transition: transform 0.2s ease;
    }
    #lightboxStage img.zoomed { transform: scale(1.6); }
    #lightboxStage video {
      max-width: 100%;
      max-height: 80dvh;
    }
    #lightboxLabel {
      margin-top: 10px;
      font-size: 13px;
      color: #cbd5e1;
    }
    #closeLightboxBtn {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #334155;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="authScreen" class="screen">
    <form id="loginForm" class="auth-card">
      <h1>تسجيل الدخول إلى BROKIN</h1>
      <input id="emailInput" type="email" placeholder="البريد الإلكتروني" required />
      <input id="passwordInput" type="password" placeholder="كلمة المرور" required />
      <button type="submit">دخول</button>
      <div id="authError"></div>
    </form>
  </div>

  <div id="chatScreen" class="screen">
    <div class="top-bar">
      <div class="brand">
        <span>BROKIN Chat</span>
        <span id="unreadBadge">0</span>
      </div>
      <button id="logoutBtn" type="button">خروج</button>
    </div>

    <div id="messages"></div>

    <div class="composer">
      <input id="mediaInput" type="file" accept="image/*,video/*,audio/*" style="display:none" />
      <button id="attachBtn" class="icon-btn" type="button" onclick="document.getElementById('mediaInput').click()">📎</button>
      <button id="recordBtn" class="icon-btn" type="button">🎤</button>
      <input id="messageInput" type="text" placeholder="اكتب رسالة..." autocomplete="off" />
      <button id="sendBtn" type="button">إرسال</button>
    </div>
  </div>

  <div id="mediaLightbox" onclick="window.closeMediaLightbox()">
    <button id="closeLightboxBtn" type="button" onclick="event.stopPropagation(); window.closeMediaLightbox()">إغلاق</button>
    <div id="lightboxStage"></div>
    <div id="lightboxLabel"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
